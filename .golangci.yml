version: "2"

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - (io.Writer).Write
        - (*github.com/fatih/color.Color).Printf
        - (*github.com/fatih/color.Color).Println
        - (*github.com/fatih/color.Color).Fprintf
        - (*github.com/fatih/color.Color).Print
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Printf
        - (io.Closer).Close
        - (*os.File).Close
        - (*net/http.Server).Close
        - (*text/tabwriter.Writer).Flush
        - os.Remove
        - os.RemoveAll
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST1000"
        - "-ST1005"
    gosec:
      # The taint-analysis rules flag the variable-in-path, variable-in-URL and
      # variable-in-log patterns that are pervasive and intended in this
      # developer tool. G703 and G706 are the newer taint versions of the
      # already-excluded G304 and are excluded on the same grounds.
      excludes:
        - G104
        - G107
        - G112
        - G114
        - G115
        - G204
        - G304
        - G306
        - G301
        - G703
        - G706

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/dominikschlosser/eudi-dev
