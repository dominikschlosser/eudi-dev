# Public demo deployment: Caddy terminates TLS for the public domain and
# proxies to the wallet, which runs in demo mode (see docs/public-demo.md).
#
# 1. Point your domain's DNS at this host.
# 2. Replace eudi-test.dev in this file and in Caddyfile with your domain.
# 3. Put your operator details into imprint.html.
# 4. Create stats.env with the /stats credentials (./deploy.sh stats-password).
# 5. docker compose up -d
#
# Every service caps its container log (Docker's json-file driver keeps them
# forever otherwise, which is the one thing here that can fill the disk).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    # Built from the Dockerfile next to this file: the standard caddy image
    # has no rate limiting, which the Caddyfile configures.
    build: .
    image: eudi-demo-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    # stats.env holds STATS_USER and STATS_PASSWORD_HASH (./deploy.sh
    # stats-password writes it). env_file, not environment: a bcrypt hash is
    # full of "$" and compose would try to interpolate those.
    env_file:
      - path: stats.env
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
      - stats-report:/srv/stats:ro

  wallet:
    # WALLET_TAG pins the release to run and lives in .env next to this file
    # on the host. It is absent in normal operation, which runs the newest
    # release, and ./deploy.sh rollback sets it to put an earlier one back.
    image: ghcr.io/dominikschlosser/eudi-dev:${WALLET_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # No published ports: only Caddy reaches the wallet.
    command:
      - wallet
      - serve
      - --demo
      - --demo-reset
      # Wall-clock schedule: the reset lands at the same local time every day
      # instead of drifting with each container restart.
      - 00:00 Europe/Berlin
      - --port
      - "8085"
      - --base-url
      - https://eudi-test.dev
      # Client identity for OID4VCI authorization-code offers. Both default
      # to the wallet origin and its /callback; set explicitly so issuers
      # that registered the demo see the same values every deployment.
      - --vci-client-id
      - https://eudi-test.dev
      - --vci-redirect-uri
      - https://eudi-test.dev/callback
      - --status-list
      - --imprint-file
      - /config/imprint.html
    volumes:
      # The parent directory, not just wallet/: the shared CA lives one
      # level above the wallet directory and must survive restarts.
      - wallet-data:/home/app/.eudi-dev
      - ./imprint.html:/config/imprint.html:ro

  # Preview instance served at preview.eudi-test.dev by the same Caddy. It runs
  # its own release (PREVIEW_TAG, set by ./deploy.sh preview), so a big change
  # can go live on the preview host and be tried there before ./deploy.sh
  # promote moves the main site to the same image. Its own base URL and data
  # volume keep it separate from the production wallet above.
  wallet-preview:
    image: ghcr.io/dominikschlosser/eudi-dev:${PREVIEW_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # Opt-in: a plain production up/push leaves it alone, and ./deploy.sh
    # preview names it explicitly to bring it up.
    profiles: ["preview"]
    command:
      - wallet
      - serve
      - --demo
      - --demo-reset
      - 00:00 Europe/Berlin
      - --port
      - "8085"
      - --base-url
      - https://preview.eudi-test.dev
      - --vci-client-id
      - https://preview.eudi-test.dev
      - --vci-redirect-uri
      - https://preview.eudi-test.dev/callback
      - --status-list
      - --imprint-file
      - /config/imprint.html
    volumes:
      - wallet-data-preview:/home/app/.eudi-dev
      - ./imprint.html:/config/imprint.html:ro

  # Conformance host served at strict.eudi-test.dev by the same Caddy: a
  # strict-mode wallet the hosted OIDF suite tests for certification. Not a
  # demo profile: it runs headless with auto-accept so the conformance
  # harness can drive it over the API (see docs/conformance-run.md). Its
  # release is pinned independently with STRICT_TAG (./deploy.sh strict).
  wallet-strict:
    image: ghcr.io/dominikschlosser/eudi-dev:${STRICT_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # Opt-in: a plain production up/push leaves it alone, and ./deploy.sh
    # strict names it explicitly to bring it up.
    profiles: ["strict"]
    # The management API is not public (the Caddy block only lets reads
    # through), so the conformance harness reaches this loopback port over an
    # SSH tunnel. Bound to the host's loopback only, never the internet.
    ports:
      - "127.0.0.1:18086:8085"
    command:
      - wallet
      - serve
      - --mode
      - strict
      - --haip
      - --auto-accept
      - --pid
      - --preferred-format
      - dc+sd-jwt
      - --port
      - "8085"
      - --base-url
      - https://strict.eudi-test.dev
      # The redirect URI the OIDF suite's authorization server sends the
      # wallet back to. The alias is fixed so the harness and this wallet
      # agree on it across runs (OIDF_VCI_ALIAS=oid4vc-dev-vci-strict).
      - --vci-client-id
      - "52480754053"
      - --vci-redirect-uri
      - https://www.certification.openid.net/test/a/oid4vc-dev-vci-strict/callback
      - --imprint-file
      - /config/imprint.html
    volumes:
      - wallet-data-strict:/home/app/.eudi-dev
      - ./imprint.html:/config/imprint.html:ro

  # Usage statistics: turns Caddy's (IP-anonymized) access log into a static
  # HTML report. No JavaScript, no cookies, nothing added to the pages.
  stats:
    image: allinurl/goaccess:latest
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Caddy creates the log on the first request, which can be after this
        # container starts, so skip the run instead of failing on a missing file.
        while true; do
          if [ -s /var/log/caddy/access.log ]; then
            goaccess /var/log/caddy/access.log \
              --log-format=CADDY \
              --ignore-crawlers --anonymize-ip \
              --html-report-title="Demo usage" \
              -o /srv/stats/report.html || true
          fi
          sleep 120
        done
    volumes:
      - caddy-logs:/var/log/caddy:ro
      - stats-report:/srv/stats

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  stats-report:
  wallet-data:
  wallet-data-preview:
  wallet-data-strict:
