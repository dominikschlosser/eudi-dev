# Public demo deployment: Caddy terminates TLS for the public domain and
# proxies to the wallet, which runs in demo mode (see docs/public-demo.md).
#
# 1. Point your domain's DNS at this host.
# 2. Replace eudi-test.dev in this file and in Caddyfile with your domain.
# 3. Put your operator details into imprint.html.
# 4. Create stats.env with the /stats credentials (./deploy.sh stats-password).
# 5. docker compose up -d
#
# Every service caps its container log (Docker's json-file driver keeps them
# forever otherwise, which is the one thing here that can fill the disk).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    # Built from the Dockerfile next to this file: the standard caddy image
    # has no rate limiting, which the Caddyfile configures.
    build: .
    image: eudi-demo-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    # stats.env holds STATS_USER and STATS_PASSWORD_HASH (./deploy.sh
    # stats-password writes it). env_file, not environment: a bcrypt hash is
    # full of "$" and compose would try to interpolate those.
    env_file:
      - path: stats.env
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
      - stats-report:/srv/stats:ro

  wallet:
    # WALLET_TAG pins the release to run and lives in .env next to this file
    # on the host. It is absent in normal operation, which runs the newest
    # release, and ./deploy.sh rollback sets it to put an earlier one back.
    image: ghcr.io/dominikschlosser/eudi-dev:${WALLET_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # No published ports: only Caddy reaches the wallet.
    command:
      - wallet
      - serve
      - --demo
      - --demo-reset
      # Wall-clock schedule: the reset lands at the same local time every day
      # instead of drifting with each container restart.
      - 00:00 Europe/Berlin
      - --port
      - "8085"
      - --base-url
      - https://eudi-test.dev
      # Client identity for OID4VCI authorization-code offers. Without both,
      # such an offer fails before PAR, so an external HAIP issuer never gets
      # to see the wallet attestation the demo would send.
      - --vci-client-id
      - https://eudi-test.dev
      - --vci-redirect-uri
      - https://eudi-test.dev/callback
      - --status-list
      - --imprint-file
      - /config/imprint.html
    volumes:
      # The parent directory, not just wallet/: the shared CA lives one
      # level above the wallet directory and must survive restarts.
      - wallet-data:/home/app/.eudi-dev
      - ./imprint.html:/config/imprint.html:ro

  # Usage statistics: turns Caddy's (IP-anonymized) access log into a static
  # HTML report. No JavaScript, no cookies, nothing added to the pages.
  stats:
    image: allinurl/goaccess:latest
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Caddy creates the log on the first request, which can be after this
        # container starts, so skip the run instead of failing on a missing file.
        while true; do
          if [ -s /var/log/caddy/access.log ]; then
            goaccess /var/log/caddy/access.log \
              --log-format=CADDY \
              --ignore-crawlers --anonymize-ip \
              --html-report-title="Demo usage" \
              -o /srv/stats/report.html || true
          fi
          sleep 120
        done
    volumes:
      - caddy-logs:/var/log/caddy:ro
      - stats-report:/srv/stats

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  stats-report:
  wallet-data:
