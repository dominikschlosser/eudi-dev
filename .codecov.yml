# Coverage configuration for Codecov.
# Files listed under "ignore" are excluded from coverage reporting
# because they contain code that is impractical to unit-test
# (CLI wiring, OS process management, terminal I/O, HTTP lifecycle, etc.).

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%

# Strip Go module prefix so ignore patterns match relative paths. This has to
# be the module path in go.mod: a prefix that does not match strips nothing,
# and every pattern below is then compared against a path that still carries
# it. The module was renamed to eudi-dev and this was left behind.
fixes:
  - "github.com/dominikschlosser/eudi-dev/::"

ignore:
  - "main.go"
  - "cmd/.*"
  # Sample applications that show how to use the toolkit. They ship as
  # documentation, they are not part of what the CLI installs, and testing
  # them measures the examples rather than the code they demonstrate.
  - "examples/.*"
  - "internal/output/printer.go"
  - "internal/proxy/subprocess.*"
  - "internal/proxy/terminal.go"
  - "internal/proxy/dashboard.go"
  - "internal/wallet/register_darwin.go"
  - "internal/wallet/server.go"
  - "internal/qr/screen.go"
  - "internal/format/input.go"
  - "internal/web/handler.go"
